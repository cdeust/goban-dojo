<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Goban Dojo : de la décision à l’apprentissage vérifié</title>
  <desc id="desc">Le kifu historique fournit une position exacte. L’apprenti joue un coup, puis Leela Zero génère deux variantes à budget égal. Le moteur de règles vérifie chaque coup et mesure les structures ; KataGo estime les positions séparément. Les résultats alimentent les révisions et le parcours guidé. Les évaluations réservées mesurent le transfert sur des positions inédites.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#cda96b" stroke-opacity=".18" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8f3c32"/></marker>
    <style>
      text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#2b2520;}
      .label {font-size:15px;font-weight:700;letter-spacing:1.4px;fill:#8f3c32;}
      .heading {font-size:25px;font-weight:700;}
      .body {font-size:17px;fill:#51483e;}
      .small {font-size:15px;fill:#51483e;}
      .card {fill:#fffaf0;stroke:#b9a58a;stroke-width:1.5;}
      .line {fill:none;stroke:#8f3c32;stroke-width:2.5;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round;}
      .proof {fill:#ecf1e6;stroke:#65805c;stroke-width:1.5;}
      .estimate {fill:#f8eadc;stroke:#ba8355;stroke-width:1.5;}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="720" rx="24" fill="#f2e7d2"/>
  <rect x="0" y="0" width="1200" height="720" rx="24" fill="url(#grid)"/>
  <circle cx="1143" cy="51" r="18" fill="#302c27" stroke="#171514" stroke-width="2"/>
  <circle cx="1102" cy="51" r="18" fill="#fffdf5" stroke="#9d8c74" stroke-width="2"/>
  <text x="47" y="49" class="label">囲碁  ·  GOBAN DOJO</text>
  <text x="47" y="84" font-size="32" font-weight="700">Apprendre par les preuves, pas par la réponse de l’IA</text>
  <text x="47" y="111" class="body">Une boucle d’apprentissage où chaque décision peut être expliquée, testée et retravaillée.</text>
  <!-- Top: original input, human decision, generated alternatives -->
  <rect class="card" x="40" y="147" width="345" height="156" rx="14"/>
  <text x="60" y="176" class="label">01  ·  SOURCE</text>
  <text x="60" y="209" class="heading">Kifu authentique</text>
  <text x="60" y="236" class="body">Position exacte, joueurs, date,</text>
  <text x="60" y="260" class="body">coups numérotés et provenance.</text>
  <text x="60" y="287" class="small">Aucune position historique inventée.</text>
  <rect class="card" x="427" y="147" width="345" height="156" rx="14"/>
  <text x="447" y="176" class="label">02  ·  APPRENTI</text>
  <text x="447" y="209" class="heading">Comprendre et choisir</text>
  <text x="447" y="236" class="body">Comprendre le principe, jouer</text>
  <text x="447" y="260" class="body">son coup et anticiper la réponse.</text>
  <text x="447" y="287" class="small">Le joueur prend la décision.</text>
  <rect class="card" x="815" y="147" width="345" height="156" rx="14"/>
  <text x="835" y="176" class="label">03  ·  SENSEI</text>
  <text x="835" y="209" class="heading">Explorer les variantes</text>
  <text x="835" y="236" class="body">Leela Zero joue des réponses</text>
  <text x="835" y="260" class="body">à partir des mêmes positions.</text>
  <text x="835" y="287" class="small">Budget égal, horizon comparable.</text>
  <path class="line" d="M389 225H420"/><path class="line" d="M776 225H808"/>
  <!-- verification lanes -->
  <rect class="proof" x="427" y="348" width="345" height="145" rx="14"/>
  <text x="447" y="377" class="label" style="fill:#456441">04A  ·  FAITS VÉRIFIÉS</text>
  <text x="447" y="411" class="heading">Moteur de règles</text>
  <text x="447" y="440" class="body">Légalité, captures, libertés,</text>
  <text x="447" y="464" class="body">chaînes et structure observable.</text>
  <rect class="estimate" x="815" y="348" width="345" height="145" rx="14"/>
  <text x="835" y="377" class="label" style="fill:#8b5b34">04B  ·  ESTIMATION</text>
  <text x="835" y="411" class="heading">Évaluateur KataGo</text>
  <text x="835" y="440" class="body">Compare le score estimé à</text>
  <text x="835" y="464" class="body">horizon égal, avec incertitude.</text>
  <path class="line" d="M986 307V327H650V341"/><path class="line" d="M986 307V341"/>
  <!-- consolidation -->
  <rect class="card" x="40" y="348" width="345" height="145" rx="14"/>
  <text x="60" y="377" class="label">05  ·  APPRENTISSAGE</text>
  <text x="60" y="411" class="heading">Carnet personnalisé</text>
  <text x="60" y="440" class="body">Révisions espacées, compétences</text>
  <text x="60" y="464" class="body">fragiles, prochaine leçon adaptée.</text>
  <path class="line" d="M423 420H392"/><path class="line" d="M980 497V516H340V499"/>
  <path class="line" d="M212 344V319H470V309"/>
  <rect x="40" y="547" width="1120" height="126" rx="14" fill="#2f2922"/>
  <text x="60" y="576" style="fill:#f0c88d; font-size:15px;font-weight:700;letter-spacing:1.4px">06  ·  MESURER LE TRANSFERT</text>
  <text x="60" y="611" style="fill:#fffaf0;font-size:25px;font-weight:700">Épreuves réservées, sans aide</text>
  <text x="60" y="640" style="fill:#eadcc8;font-size:17px">Positions issues d'autres parties. Résultats répétés à des dates distinctes. Les erreurs nourrissent le carnet.</text>
  <path class="line" d="M175 497V540"/>
  <path class="line" d="M248 543V499"/>
  <text x="1160" y="695" text-anchor="end" class="small">Le grade officiel reste distinct du jalon pédagogique.</text>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Données, types, lint, tests, audit, build, e2e
    runs-on: ubuntu-latest
    # Le runner logiciel peut dépasser 25 min avec la suite WebGL complète.
    # Conserver les délais et assertions de chaque scénario Playwright.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Installer (lockfile figé, scripts d'installation désactivés)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reconstruire les données et vérifier qu'elles sont identiques à celles du dépôt
        run: |
          pnpm data:build
          git diff --exit-code -- public/data data/report.json src/story/schoolCatalog.json src/story/advancedCatalog.json src/story/strategyCatalog.json src/story/endgameCatalog.json
      - run: pnpm typecheck
      - name: Lint et analyse statique de sécurité (SAST)
        run: pnpm lint --max-warnings 0
      - name: Garde d'architecture (couches, frontières, cycles)
        run: pnpm arch
      - run: pnpm format:check
      - run: pnpm test
      - name: Audit des dépendances
        run: pnpm audit:deps
      - name: SBOM (CycloneDX)
        run: pnpm sbom
      - run: pnpm exec vite build
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests de bout en bout et contrôles dynamiques (DAST) sur la version construite
        run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rapports
          path: |
            sbom.cdx.json
            data/report.json
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  accounts:
    name: Comptes, synchronisation et session visiteur (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Démarrer la base Auth locale isolée
        run: pnpm dlx supabase@3.4.0 start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /tmp/supabase-local.log 2>&1
      - run: pnpm exec playwright install --with-deps chromium
      - name: Vérifier les politiques de propriété de la base locale
        run: pnpm dlx supabase@3.4.0 test db
      - name: Contrôler les advisors Supabase locaux
        run: pnpm dlx supabase@3.4.0 db advisors --type all --level warn --fail-on warn
      - run: pnpm e2e:accounts
      - name: Arrêter la base de test locale
        if: always()
        run: pnpm dlx supabase@3.4.0 stop > /dev/null 2>&1
